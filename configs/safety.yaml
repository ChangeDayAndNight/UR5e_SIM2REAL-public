# =====================================================================
# safety.yaml — 안전 한계 (요소5). common/safety.py:SafetyGuard가 소비.
# sim 리허설(Phase3)과 실기(Phase4)가 같은 값을 읽는다 — sim에서 안 걸리면
# 실기에서도 안 걸리도록 값을 보수적으로 잡는 것이 원칙.
# =====================================================================

# ★★2026-08-10 ur5e_workcell_drawing.html 반영★★ 도면 tcp_bounds x[0.21,0.71]·y[±0.25]를
#   x 미러해 적용. ⚠️도면 z 상한 0.40은 ★홈 TCP z=0.5091을 즉시 위반★해 기동 불능이 되므로
#   상한은 0.60을 유지한다(safety.yaml 아래 경고 참조).
workspace:
  # TCP 위치 AABB [m], base frame — 이탈 시 즉시 trip(e-stop hook 호출)
  # TODO: 실제 셀 배치(테이블/bin/벽) 실측 후 확정
  # ★2026-07-28 z 상한 0.50 → 0.60★: 홈 포즈 교체(카메라가 작업면을 보도록 (0,-90,+45,-32,-90,0))로
  #   홈 TCP가 z=0.5249가 되면서 ★홈 자세 자체가 AABB 밖★이 됐다 — SafetyGuard.check(safety.py:70)이
  #   시작 즉시 "workspace 이탈"로 trip·latch해 배포/리허설이 아예 기동하지 못한다(실측 확인).
  #   운용 포락선이 홈을 포함해야 하므로 상한을 홈 위 7.5cm 여유로 올린다.
  #   ⚠️ 완화가 아니라 '새 운용 범위 반영'이다 — sim 리허설과 실기가 같은 값을 쓰는 원칙(§8-1)은 유지.
  #   ⚠️ 실셀 천장·구조물 실측 시 이 값이 물리적으로 안전한지 재확인할 것(로봇 base가 바닥+0.80m).
  #   회귀 방지: tests/test_home_pose_contract.py가 '홈 TCP ⊂ AABB'를 강제한다.
  # ★2026-07-28(2차) 배치 180° 반영★: 벨트가 base frame −x로 가면서 운용 포락선도 −x로 이동.
  #   x [0.20,0.70] → [−0.70,−0.20] (부호·순서 반전). y·z는 180° 회전에 불변.
  #   신 홈 TCP (−0.3012,−0.1328,0.525)가 AABB 안 — 여유 75mm(FK 실측 확인).
  #   ⚠️완화가 아니라 '같은 크기의 포락선을 반대편으로 옮긴 것'이다(부피 불변, §8-1 유지).
  # ★2026-07-28(3차) 벨트 1cm 하강 동반★: z 하한 0.00 → −0.01(= 벨트 상면).
  #   안착 시 TCP(=파지중심)가 큐브 중심 z=0.005까지 내려간다 — 하한이 0.00이면 여유 5mm로
  #   센서 노이즈만으로 trip한다. 하한을 벨트 상면에 맞추면 15mm 여유 확보(벨트보다 아래로는
  #   여전히 못 내려간다 = 벨트 충돌 방지 의미 유지).
  # ★★2026-08-11 도면 정합★★ x 하한 −0.71 → ★−0.75★.
  #   [필요성] 벨트 중심이 40mm 멀어져 픽존이 x −0.725까지 간다 — 구 하한 −0.71이면
  #     ★정상 작업 중에 SafetyGuard가 trip★한다(완화가 아니라 새 셀 배치 반영).
  #   [값 근거] 도면 `tcp_bounds_suggestion.x: [250,750]` = 내측 작업영역 원거리 끝단.
  #     sim 부호로 −0.75이며 픽존 −0.725에 25mm 여유를 준다. 프레임 외곽(−0.79)까지
  #     열지 않는다 — 프로파일 위는 작업 영역이 아니다.
  #   상한 −0.21은 유지: 홈 TCP x=−0.2975가 그 안이어야 한다(test_home_pose_contract).
  min: [-0.75, -0.35, -0.0375]
  max: [-0.21,  0.35,  0.60]
  # ★★2026-08-12(감사 B1) TCP 하강 바닥★★ — sim 액션 클램프(tcp_z_floor = table_height
  #   −0.0375 + 여유 0.030)와 ★반드시 같은 값★. sim에서 학습된 정책은 이 클램프가 하강을
  #   막아 준다는 전제로 행동한다 — 실기에서 이 바닥이 없으면 벨트 압착 경로가 열린다.
  #   동기 강제 = tests/test_safety_zfloor.py (sim.yaml table_height_m + env cfg 여유값 대조).
  tcp_z_floor_m: -0.0075

limits:
  joint_vel_max_rad_s: 1.0     # 전 관절 공통 — UR5e 스펙(π rad/s)보다 보수적
  tcp_force_max_n: 50.0        # TCP wrench norm 상한 (실측 노이즈 고려 TODO)
  tcp_linear_vel_max_m_s: 0.25
  tcp_angular_vel_max_rad_s: 0.5

estop:
  # e-stop hook 동작: SafetyGuard.trip() → RobotInterface.emergency_stop()
  #   sim  = 물리 정지 + 에피소드 종료
  #   real = servoStop + (⚠️ TODO: ur_rtde stopScript 여부 확인)
  # 하드웨어 물리 e-stop 버튼은 이 소프트웨어 계층과 "독립"이다 (대체 불가).
  latch: true                  # trip 후 재기동 전까지 모든 명령 차단
