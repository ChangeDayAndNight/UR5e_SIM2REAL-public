_readme: "★전 객체 배치 레지스트리(Position/Rotation/Scale)★ — 생성기: scripts/tools/dump_scene_layout.py\n· 단위 m, 회전 quaternion = wxyz,\
  \ frame 필드가 기준 좌표계(기본 base = UR5e base_link = env origin).\n· ★이 파일은 기록/감사/GUI 왕복용 스냅샷이다 — 학습 env가 직접 읽지 않는다.★\n  배치를 바꾸려면\
  \ 각 객체의 source_of_truth(대개 configs/sim.yaml scene.*)를 고치고 생성기를 다시 실행.\n· GUI로 배치를 확정하는 절차: scripts/tools/place_workspace_gui.py\
  \ 실행 → 기즈모/슬라이더로 배치 →\n  Phase1/logs/workspace_ghost_pose.yaml 기록 → `dump_scene_layout.py --from-gui` 로 이 파일 갱신 →\n  값 검토\
  \ 후 configs/sim.yaml scene.* 에 반영(학습에 실제 적용되는 지점).\n· size_m은 큐보이드 실치수, scale은 USD 스케일 배율(3DGS 배경 등)."
schema_version: 2
