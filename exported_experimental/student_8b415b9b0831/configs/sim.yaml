# =====================================================================
# sim.yaml — sim 전용 파라미터 (env_isaaclab에서만 로드)
# =====================================================================

scene:
  # ★2026-07-07 실기 셀 반영: bin → 정적 컨베이어 벨트(평면 워크스페이스)★
  #   사용자 결정: 벨트는 정지(static) 상태에서 시작, 벨트 위엔 pick할 큐브만 둔다.
  num_objects: 1              # ★2026-07-09 4→1 (Franka Lift 정합)★ — 큐브 4개 + "하나라도 떨어지면
                              #   종료"라 팔이 다른 큐브를 쳐서 에피소드가 ~40스텝에 죽었음(carry 학습 불가).
                              #   1개면 any_object_dropped=목표큐브 낙하만 판정 → 에피소드 완주 → 전체
                              #   pick-place 학습. 다중 큐브/clutter는 이후 커리큘럼으로 재추가.
  # ★2026-07-28(3차) 실셀 벨트 실측 확정 — 사용자: 좌우(y) 100cm · 앞뒤(x) 65cm★
  #   (경위: 2차에서 GUI belt_scale_y=1.5261을 y 0.992로 반영했다가, 3차에 실측 100cm로 확정.
  #    구 "y=65cm 실측 고정" 지시는 이 지시로 대체됨 — 65cm는 앞뒤(x)였다.)
  #   ⚠️이 값은 ★물리 벨트★다. 로봇이 닿는 구역은 아래 pick_zone_m이 따로 정한다 —
  #     100cm는 UR5e 도달한계(0.817m)보다 커서 벨트 전역에서 집을 수 없기 때문.
  # ★★2026-08-10 ur5e_workcell_drawing.html 반영 (사용자 제공 치수도)★★
  #   원점 = 로봇 base 장착면(플레이트 상면). 도면은 '+X = workspace 방향'으로 자체 정의했으나,
  #   실기 관절 방향 규약(J2/J3/J4 음수 = workspace 방향)을 FK로 검증한 결과 workspace는
  #   ★base frame −X★다(Δx: J2 −0.159 / J3 −0.085 / J4 −0.017 — 세 관절 일치) → x를 미러해 반영.
  #   실기 홈 (0, −90, 0, −90, 0, 0)deg 기준.
  #   프레임 외곽(프로파일 포함) 0.58 × 0.58 · 두께 = 프로파일 4cm.
  #   ★2026-08-10 사용자 확정★: 도면의 4+50+4=58 은 ★x(앞뒤) 폭★이고, y(길이)는 지정이
  #   없어 도면이 58로 '가정'했던 값이다 — 실제 길이는 ★1.0 m★로 확정.
  # ★★2026-08-11 도면 정합(ur5e_workcell_drawing.html Rev C)★★
  #   Y 1.00 → ★1.25★: 도면 프레임 전체 길이 1250 = 프로파일40 + 내측1170 + 프로파일40.
  #   (도면 주기 4의 해석을 따랐다 — 1250을 '프로파일 포함 전체'로 본다.)
  belt_size_m: [0.58, 1.25, 0.04]   # ★프레임 외곽★ [x 58cm(4+50+4), y 100cm, z 프로파일 4cm].
                                    #   시각·물리 형상 전용 — ★스폰/타겟 범위는 아래 pick_zone_m★.

  # ★★2026-07-28(3차) 픽존 분리 — 물리 벨트 ≠ 로봇이 닿는 구역★★
  #   [문제] belt_size_m 하나가 '시각적 벨트'와 '큐브 스폰 분포'를 겸하고 있었다. 실측 벨트가
  #     100cm가 되자 스폰 모서리 반경이 0.83~0.92m로 UR5e 도달한계(상완0.425+전완0.392=0.817)를
  #     넘어, ★영원히 집을 수 없는 큐브★가 생기고 safety AABB도 벗어났다.
  #   [해법] 물리 벨트는 실측대로 두고(카메라가 실제 벨트를 본다), 스폰·타겟은 이 픽존으로 제한.
  #     실기에서도 사람이 로봇 닿는 곳에 물건을 둘 테니 현실적이다.
  #   [값 선택] ★2026-07-28(4차) 사용자 요청 "0.75 × 0.65" → ★x 상한 0.63으로 클램프★.
  #     0.75가 불가능한 이유(둘 다 위반):
  #       ① 물리 벨트 앞뒤 깊이가 0.65 — 픽존이 벨트를 벗어나 큐브가 허공에 스폰된다.
  #       ② safety AABB x[−0.70,−0.20]에 스폰이 들어가려면 x ≤ 0.63 (여유 0 기준).
  #     → 요청 방향(앞뒤 확대)의 최대값은 0.63이지만 ★safety 경계 여유가 0mm★가 되어
  #       센서 노이즈만으로 trip한다(홈 포즈엔 이미 '경계 여유 ≥10mm' 규칙이 있다 —
  #       test_home_pose_contract). 같은 기준을 스폰에도 적용해야 한다.
  #     ★2026-07-28(5차) 사용자: "애매하게 0.61로 하지 말고 0.60" → ★0.60 확정★.
  #       계산상 최대(0.63)에서 여유만 뺀 0.61은 근거 없는 끝수였다. 0.60이 더 낫다 —
  #       경계 여유가 10mm → ★15mm★로 늘고 값도 명확하다. 좌우(y)는 요청대로 0.65 유지.
  #   ⚠️난이도 상승: 최원 스폰 반경 0.686 → 0.733 m (도달한계의 84% → ★90% 신장★).
  #     teacher v2가 97.9%를 낸 조건(0.686)보다 팔을 더 뻗어야 한다 — 재학습 시 iter 300~600
  #     grasp 조기 게이트로 감시할 것(고신장 자세는 정밀도·가반하중이 떨어진다).
  #   검증(적용 전 계산): 스폰 x∈[−0.685,−0.215] y∈±0.260 → safety x[−0.70,−0.20] 여유 15mm ✓
  #     최원 스폰 반경 0.733 m < 도달한계 0.817 ✓ / 픽존 ⊂ 물리 벨트(0.60≤0.65, 0.65≤1.00) ✓
  #   ★도면 inner(실작업영역) 0.50×0.50에서 큐브 반변 2.5cm를 뺀 값★ (2026-08-10).
  #   검산: 최원 스폰 반경 0.721 m < 도달한계 0.817 ✓ / 픽존 0.45 ≤ 벨트 0.58 ✓
  #   ★축별 제약이 다르다★: x는 실작업영역(0.50)−큐브반변 = 0.45가 상한,
  #   y는 작업영역이 0.92로 넓지만 ★UR5e 도달한계★가 먼저 걸린다.
  #   검산(최원 스폰 모서리 반경): y=0.60 → 0.748 m ✓ / y=0.65 → 0.758 ⚠️ / y=0.87 → 0.811 ⚠️
  #   (도달한계 0.817 = 상완 0.425 + 전완 0.392. 권장 여유선 0.75)
  # ★★2026-08-30 카메라 FOV 정합 — 홈 교체에 따른 축소★★
  #   [문제] 새 홈(0/-76/-103/-96/+93/+4)은 카메라가 작업면 위 0.487m로 구 홈(0.749m)보다
  #     26cm 낮다. 조준점은 벨트 중심에서 13.2cm로 정확하지만 시야 면적이 줄어
  #     ★스폰존 가시율이 100% → 68.2%★로 떨어졌다 = 에피소드의 31.8%가 큐브가 프레임 밖.
  #   [이력] 이 프로젝트는 같은 기전으로 두 번 무너졌다 — 가시율 27.1%일 때 student가
  #     에피소드 73%를 '아무것도 안 보이는' 상태로 시작했고, 18.3%일 때 eval grasp 0.8%였다.
  #     teacher는 특권 상태라 무영향이고 ★student만 죽는다★.
  #   [조치] 카메라를 올리는 대신 ★스폰을 보이는 영역으로 제한★한다(사용자 결정).
  #     0.45x0.60 → 0.35x0.59. 실제 스폰(±margin 0.075) x[-0.600,-0.400] y[±0.220],
  #     ★가시율 100.0%★. 최원 모서리 도달 0.639m < 한계 0.817m (여유 178mm).
  #   [대가] 스폰 면적이 1350cm² → 880cm²(65%)로 줄어 위치 다양성이 감소한다.
  #     가시율 100%가 다양성보다 우선한다는 판단 — 안 보이면 배울 수 없다.
  pick_zone_m: [0.35, 0.59]        # [x, y] — 작업면 중심 기준 스폰/타겟 허용 구역 [m].
  # ★2026-07-27 배치 상수 yaml 승격(사용자 지시: 모든 객체 P/R/S를 기록·수정 가능하게)★
  #   구: mdp/scene.py에 BELT_CENTER_X/Y·STAND_HEIGHT 하드코딩 → GUI로 배치를 바꿔도
  #   반영 경로가 없었다. 값은 기존과 동일(0.45/0.0/0.80)이라 ★학습 거동 불변★이며,
  #   앞으로 place_workspace_gui.py 실측이 이 키들을 갱신한다.
  #   전 객체 스냅샷/감사 기록 = configs/calib/scene_layout.yaml (생성기: scripts/tools/dump_scene_layout.py).
  # ★★2026-07-28(2차) 실셀 배치: 로봇이 벨트를 등지고 선다 = 벨트가 base frame −x★★
  #   사용자 GUI 실측: belt_center_x −0.45 · belt_yaw −180° (로봇 world yaw 180°, 벨트는 world +x 유지).
  #   ⚠️이것은 C-2(URDF base_link↔UR 컨트롤러 Base의 Rz(π))와 ★별개★다 — C-2는 URDF가 고정한
  #     프레임 관례이고, 이건 로봇의 물리적 설치 방향이다. 서로 상쇄되지 않으며 둘 다 적용된다.
  # ★★2026-08-11 도면 정합★★ x −0.46 → ★−0.50★.
  #   도면: 베이스 중심 → workspace ★끝단★ 210, 프레임 전체 580 ⇒ 프레임 X 210~790,
  #   중심 = 500. 이 저장소는 배치 180°라 부호가 반대다 ⇒ 중심 ★−0.500★, 프레임 [−0.79,−0.21].
  #   구 −0.46은 프레임을 [−0.75,−0.17]에 두어 ★끝단이 170★이었다(도면 210 대비 40 어긋남).
  belt_center_xy_m: [-0.50, 0.0]     # 벨트(워크스페이스) 중심 xy [m] — base frame.
                                    #   ⚠️ common.yaml target.sample_range·스폰 분포와 함께 움직여야 함.
  belt_yaw_deg: 180.0              # 벨트 z축 회전 [deg]. ★0 또는 ±180만 지원★ — 스폰/타겟 샘플링이
                                    #   축정렬(axis-aligned)이라 임의 각도는 조용한 불일치를 만들지만,
                                    #   180°는 (x,y)→(−x,−y)로 축정렬 박스를 자기 자신에 사상하므로 안전하다
                                    #   (벨트는 y대칭 박스라 기하학적으로 무연산). scene.py가 그 외 각도를 거부.
  #   ★도면★ 작업면 = 바닥 +0.8325 m (지지대 0.86 + 플레이트 0.01 = base 0.87,
  #   작업면은 base보다 3.75cm 아래). STAND = 작업면 − 바닥 = −0.0375 + 0.87 = 0.8325
  #   → 로봇 받침대 높이(STAND − TABLE) = 0.87 m ✓ 도면 일치.
  stand_height_m: 0.8325             # 바닥→작업면(z=TABLE_HEIGHT) 높이 [m]. 시각/낙하 스캐폴딩
                                    #   ⚠️벨트 상면(table_height_m)과 별개 — 로봇 받침대는 base에 맞춘다.
                                    #   (base frame 정책엔 무영향). ⚠️ 실측 테이블 85cm 기준 잠정 0.80.
  # ★★2026-07-29 최종 큐브 5cm 확정 (Grasp_PhysicsTest 실측 근거)★★
  #   ①2FG7 실측 최소 폐합 40mm → ★3cm 큐브는 손가락 사이를 통과해 파지 불가★.
  #   ②5cm(편측 침투 4.0mm)는 sim 접촉모델이 유지하지 못한다 — 강성 2000~35000·마찰 1.5~2.5·
  #     폐합속도 3종·파지높이 3종을 전부 시도했으나 전패(Phase1/logs/gt*.log).
  #   ③★2026-07-29 최종: 5cm 확정(사용자 결정)★ — 폐합 42mm에 편측 침투 4mm,
  #     pad 높이 40mm가 큐브의 80%를 덮어(6cm는 67%) 파지 안정성이 낫다.
  #   ⚠️연동: target.z = 상면+반변 = -0.0375+0.025 = -0.0125 / 스폰여유 0.075 /
  #     MIN_LIFT는 상대식(상면+반변+0.025)이라 자동 추종.
  object_size_m: 0.05              # ★큐브 한 변 = 5cm(실기 물체)★. 스폰/보상 임계가 이 값을 참조.
  # ★★2026-08-11 사용자 지시★★ 큐브 색 팔레트 — 스폰 시 이 중 ★하나★가 선택된다.
  #   RGB [0,1]. 학습에는 영향이 없다(teacher는 카메라가 없고 student는 depth 관측) —
  #   시각 확인·논문 그림·향후 RGB 관측 전환 대비용이다.
  #   적용 = mdp/events_dr.py make_object_color_choice_events (mode="startup", per-env 1회).
  object_color_palette:
    - [0.80, 0.15, 0.15]   # 빨강
    - [0.15, 0.35, 0.85]   # 파랑
  # ★★2026-07-28(3차) 사용자 실측: 벨트 상면이 로봇 base보다 1cm 낮다★★
  #   ⚠️★common.yaml target.sample_range.z를 반드시 함께 옮긴다★ (현행 -0.0125 = 상면 + 큐브 반변).
  #     2026-07-16 사고: 벨트만 내리고 타겟 z를 안 옮겨 타겟이 공중에 떠 placed 영구 0.
  #   ⚠️safety.yaml workspace z 하한도 벨트 상면과 동반 이동 — 안 하면 안착 직전 trip.
  #   MIN_LIFT(=TABLE_HEIGHT+반변+0.025)·낙하종료(TABLE_HEIGHT−0.05)·스폰 z는 상대식이라 자동 추종한다.
  table_height_m: -0.0375            # base frame 기준 작업면 z — ★도면: base 장착면보다 3.75cm 아래★.
                                    #   ★2026-07-16 belt-lowering 철회 — 근본원인 target-z 버그 확정★:
                                    #   TCW1 farming 완화용으로 벨트를 -0.086 낮췄으나, placement 타겟 z는
                                    #   common.yaml target.z=0.015(벨트=0 안착점)에 고정 → 벨트만 8.6cm
                                    #   내려가고 타겟은 그대로라 타겟이 낮춘 벨트 위 8.6cm 공중에 뜸.
                                    #   placed 조건 at_target(<3cm)이 8.6cm 격차를 못 넘어 placed 영구 0
                                    #   (릴리스 배리어로 오인했던 실체). TCW1의 8.6cm 그립오프셋은 IK
                                    #   (tcp_offset z=0.2262)가 TCP공간에서 추상화하므로 벨트=0으로도
                                    #   부착 가능하고, pregrasp 큐브(z=0.2617)가 타겟(0.015)보다 26cm 위라
                                    #   farming도 없음 → 검증 99% 기하(벨트=0) 그대로 복귀.
                                    #   ★confirm-before-retrain: 실측 belt-surface↔base 수직오프셋이 0이
                                    #     아니면 이 값으로 교체(예: 벨트가 base보다 10cm 아래면 -0.10) —
                                    #     단 그때는 common.yaml target.z도 함께 이동해야 함(이 버그의 교훈).

camera:
  # eye-in-hand(손목 장착, 2026-07-14 사용자 확정). pose는 여기 두지 않는다 —
  # configs/calib/hand_eye.yaml의 T_flange_cam이 유일한 소스 (요소4: sim/real 공유).
  # ★2026-07-19 해상도 112² 상향(② 카드 h1 — 사용자 결정 ③→② 순서)★:
  #   64²에서 3cm 큐브가 원거리 3~5px = 소형 CNN 정체(~15%)의 유력 병목. 112² =
  #   렌더 버퍼 3.06배(128²의 4배 대비 절충, ResNet18 stride32에 4×4 feature 정합 —
  #   b1 백본 카드와 한 묶음). VRAM 실측 사다리 384→256→192(스모크 선행).
  #   ⚠️ obs 계약 변경(16414→50206) — 구 64² ckpt(g·r 계보)와 상호 로드 불가(새 계보).
  width: 112                  # TiledCamera 렌더 가로 = preprocess 출력 가로
  # ★★Student v2(2026-09-18, F89) 112 → 63★★: Kit 렌더는 픽셀이 등방(f_x=f_y)이라 세로 FOV는
  #   가로 FOV × (height/width)로 정해진다 — vertical_fov_deg·vertical_aperture는 렌더에 닿지 않는다
  #   (배포 v2 export가 실측한 사실: 112² 렌더는 69.4°×69.4°였다). 실기 D435i color 69.4°×42.5°와
  #   같은 각도 샘플링을 만들려면 height = round(width · tan(21.25°)/tan(34.7°)) = 63 (→ 42.6°).
  #   공유 전처리(frame_mode=full)가 112×63을 112²로 비등방 리사이즈한다 = 실기 848×480 → 112² 경로와 동일.
  height: 63
  # ★2026-07-17 RGB-D 전환(B안)★: rs.align(depth→color) 후 두 채널 모두 color
  #   intrinsics 프레임 → sim도 D435i ★color★ 세로 FOV로 렌더(공칭 42.5°±3°).
  #   구 58.0은 depth 스트림 단독 FOV(depth-only 시대 계약 — common.yaml 참조).
  #   ⚠️ Phase3 Calib/ObsParity에서 실측 color intrinsics로 보정 검토.
  vertical_fov_deg: 42.5
  # ★2026-07-18 frame_mode=full 전용★: D435i color 가로 FOV(공칭 69.4°) — sim은
  #   비등방 aperture(112×112 픽셀에 69.4×42.5°)로 렌더 = real의 848×480 전체 프레임
  #   112² 리사이즈와 동일 각도 샘플링(등가 계약 — common.yaml frame_mode 참조).
  horizontal_fov_deg: 69.4
  clipping_near_m: 0.05       # Franka 교훈: 기본 near-clip이 근접 객체를 잘라먹음

training:
  # Phase1 teacher (카메라 없음): 4096 envs OOM-free (Franka 실측)
  # ★2026-09-18 Teacher v2, RTX 5070 Ti 16 GB 실측★ 4096 → 16384 (2의 제곱).
  #   30 iter 프로브: 8192 = 2.70 s/iter·73k steps/s·VRAM 5.9 GB / 16384 = 3.85 s/iter·102k steps/s·
  #   VRAM 8.3 GB(52%)·GPU 65%. 16384는 iteration당 표본 2배를 1.43배 시간에 얻는다(25k ≈ 27 h).
  #   PhysX aggregate 용량 경고 없음. OOM이면 8192로만 내린다(다른 하이퍼파라미터 동시 변경 금지).
  teacher_num_envs: 16384
  # Phase2 vision student: 현행 TiledCamera 112² RGB-D 계약의 시작값 — 실측 VRAM으로 조정
  # (OOM 시 관측 계약은 유지하고 num_envs만 128→64→32 순서로 축소)
  student_num_envs: 128
  max_iterations: 20000
  seed: 42
